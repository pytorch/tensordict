[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
# black did not format the code blocks of Markdown files
exclude = ["*.md"]

[tool.ruff.lint]
# pycodestyle, pyflakes, flake8-bugbear, flake8-comprehensions, flake8-print,
# pydocstyle and import sorting: what flake8 (with its plugins), pydocstyle and
# usort checked before ruff replaced them.
# TC004: a name imported under TYPE_CHECKING and used at run time, which only
# fails when that code runs.
select = ["E", "W", "F", "B", "C4", "T20", "D", "I", "TC004"]
ignore = [
    "E402",  # imports below module code: several modules re-export at their end
    "E501",  # line length is the formatter's job
    "E701",  # one-line compound statements are the formatter's job
    # Rules that the flake8 setup did not run: bugbear's opinionated B9 checks,
    # and checks newer than the plugins it pinned.
    "B026",  # star-arg unpacking after a keyword argument
    "B028",  # warnings.warn without stacklevel
    "B904",  # raise without from inside except
    "B905",  # zip() without strict=
    "C419",  # list comprehension in any() or all()
    "C420",  # dict comprehension that dict.fromkeys() could replace
    # pydocstyle codes the repo ignored
    "D100",
    "D102",
    "D104",
    "D105",
    "D107",
    "D417",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"test/smoke_test.py" = ["F401"]
# flake8 matched test_*.py against file names anywhere, benchmarks included.
# ruff's B018 also flags attribute access, which pytest.raises blocks use.
"test_*.py" = ["B018", "E731"]
# tutorial cells show values with bare expressions, and place their imports
# where the text needs them
"tutorials/**" = ["B018", "E741", "I", "T201"]
"benchmarks/**" = ["T201"]
".github/scripts/*.py" = ["T201"]
".github/unittest/**" = ["B018"]
"packaging/**" = ["T201"]
"tensordict/functional.py" = ["E741"]
"tensordict/nn/functional_modules.py" = ["D103"]
# pydocstyle checked the .py files of tensordict/ only
"!tensordict/**" = ["D"]
# Stubs: pydocstyle and usort did not check them, and `from x import y`
# re-exports names that pyflakes sees as unused.
"*.pyi" = ["D", "I", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# As usort did with first_party_detection = false: tensordict, torch and the
# other third-party imports share one block.
known-third-party = ["tensordict"]
order-by-type = false
combine-as-imports = true

[project]
name = "tensordict"
dynamic = ["version"]
description = "TensorDict is a pytorch dedicated tensor container."
authors = [
  { name="Vincent Moens", email="vincentmoens@gmail.com" },
  { name="Peter Sharpe", email="peterdsharpe@gmail.com" },
  { name="Ben Sprenger", email="ben.sprenger@rogers.com" },
  { name="Achintya Paningapalli", email="apaninga@berkeley.edu" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "torch>=2.13.0a0",
    "numpy",
    "cloudpickle",
    "packaging",
    # orjson fails to be installed in python 3.13t
    'orjson ; python_version < "3.13"',
    "pyvers (>=0.2.0,<0.3.0)",
    # typedtensordict.py imports NotRequired from it on Python 3.10
    'typing_extensions>=4.0 ; python_version < "3.11"',
]

[project.urls]
homepage = "https://github.com/pytorch/tensordict"

[project.optional-dependencies]
tests = [
    "pytest",
    "pyyaml",
    "pytest-instafail",
    "pytest-rerunfailures",
    "pytest-benchmark",
    "mypy>=1.0.0"
]
h5 = ["h5py>=3.8"]
# zarr>=3 requires Python>=3.11: the marker keeps universal resolvers (uv)
# and Python 3.10 installs working, at the price of the extra being a no-op there
zarr = ["zarr>=3.0; python_version >= '3.11'"]
pandas = ["pandas>=1.5"]
parquet = ["pyarrow>=10.0"]
tabular = ["pandas>=1.5", "pyarrow>=10.0"]
typecheck = ["mypy>=1.0.0"]
onnx = ["onnx", "onnxscript", "onnxruntime"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
# Only the tensordict package: namespace discovery would otherwise pick up any
# directory in the source root, such as scripts/ or a previous build's build/.
include = ["tensordict", "tensordict.*"]

[tool.setuptools_scm]
# Use SETUPTOOLS_SCM_PRETEND_VERSION=M.Major.Minor to set the version for stable releases
version_scheme = "post-release"
# Local scheme is handled by setup.py (appends +g<sha> unless on release/v<version> branch)
local_scheme = "no-local-version"
version_file = "tensordict/_version.py"
fallback_version = "0.11.0"

[tool.mypy]
files = "tensordict"
show_error_codes = true
pretty = true
allow_redefinition = true
warn_redundant_casts = true
# Be more lenient with type checking
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
strict_equality = false
# Ignore missing imports for external libraries
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torchvision.*"
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
