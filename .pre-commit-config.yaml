repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-docstring-first
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
        exclude: packaging/.*
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  # torchfix's PyTorch rules only run as a flake8 plugin
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        name: torchfix
        args: [--select=TOR, "--per-file-ignores=test_*.py:TOR101"]
        additional_dependencies:
          - torchfix==0.5.0

  - repo: local
    hooks:
      - id: check-rst-titles
        name: check RST title underlines
        entry: python scripts/check_rst_titles.py
        language: python
        types: [rst]
        pass_filenames: true
