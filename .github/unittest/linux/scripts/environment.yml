channels:
  - pytorch
  - defaults
dependencies:
  - pip
  - pip:
    # Keep pip patched even if conda replaces it during env update.
    - pip>=26.2.2
    - certifi>=2026.10.23
    - cloudpickle
    - pytest
    - pytest-benchmark
    - pytest-instafail
    - pytest-rerunfailures
    - pytest-timeout
    - pytest-xdist
    - h5py
    - orjson
    - numpy
    - mosaicml-streaming
    - Brotli>=1.2.1
    - mypy
    - pandas
    - pyarrow
    - redis
    - safetensors
