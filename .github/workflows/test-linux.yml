name: Unit-tests on Linux

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
  workflow_dispatch:
  workflow_call:

env:
  CHANNEL: "nightly"

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On master, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: test-linux-${{ github.ref == 'refs/heads/main' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test-gpu:
    strategy:
      matrix:
        python_version: ["3.10"]
        cuda_arch_version: ["12.8"]
      fail-fast: false
    runs-on: mt-l-x86aavx2-11-41-a10g
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
      options: --gpus all
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CUDA_ARCH_VERSION: ${{ matrix.cuda_arch_version }}
          TORCH_VERSION: nightly
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          export CU_VERSION="cu${CUDA_ARCH_VERSION:0:2}${CUDA_ARCH_VERSION:3:1}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh
          bash .github/unittest/linux/scripts/post_process.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-gpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  test-cpu:
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
      fail-fast: false
    runs-on: mt-l-x86iavx512-48-384
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CU_VERSION: cpu
          TORCH_VERSION: nightly
          # pytest-xdist workers for run_test.sh; the runner has 48 CPUs.
          TD_TEST_WORKERS: 16
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh
          bash .github/unittest/linux/scripts/post_process.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  test-stable-gpu:
    strategy:
      matrix:
        python_version: ["3.10"]
        cuda_arch_version: ["12.6"]
      fail-fast: false
    runs-on: mt-l-x86aavx2-11-41-a10g
    container:
      image: "nvidia/cuda:12.6.0-devel-ubuntu22.04"
      options: --gpus all
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
