      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CUDA_ARCH_VERSION: ${{ matrix.cuda_arch_version }}
          TORCH_VERSION: stable
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
