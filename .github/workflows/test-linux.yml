name: Unit-tests on Linux

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - nightly
      - main
      - release/*
  workflow_dispatch:
  workflow_call:

env:
  CHANNEL: "nightly"

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On master, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  # The Nightly Orchestrator calls this workflow, and a called workflow evaluates the group with the caller's
  # context: without the event name, the nightly run for main's head joined the group of its push run and
  # cancelled it.
  group: test-linux-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test-gpu:
    strategy:
      matrix:
        # torch nightlies have no Python 3.10 wheels since 2.15
        python_version: ["3.12"]
        cuda_arch_version: ["13.0"]
      fail-fast: false
    runs-on: mt-l-x86aavx2-11-41-a10g
    container:
      image: "nvidia/cuda:13.0.0-devel-ubuntu22.04"
      options: --gpus all
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CUDA_ARCH_VERSION: ${{ matrix.cuda_arch_version }}
          TORCH_VERSION: nightly
          # Triton 3.9 warns at its first kernel launch when this is unset,
          # and test_generic.py turns warnings into errors. "1" keeps its
          # current default, fusion on.
          TRITON_DEFAULT_FP_FUSION: "1"
          # run_test.sh skips test_distributed.py: its CUDA tests need 2 GPUs,
          # and test-cpu (3.12) runs the rest on the same Python and torch.
          TD_SKIP_DISTRIBUTED_TESTS: "1"
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          export CU_VERSION="cu${CUDA_ARCH_VERSION:0:2}${CUDA_ARCH_VERSION:3:1}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-gpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  test-cpu:
    strategy:
      matrix:
        # torch nightlies have no Python 3.10 wheels since 2.15: 3.10 runs in
        # test-stable-cpu and test-oldest-cpu
        python_version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
      fail-fast: false
    runs-on: mt-l-x86iavx512-48-384
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CU_VERSION: cpu
          TORCH_VERSION: nightly
          # pytest-xdist workers for run_test.sh; the runner has 48 CPUs.
          TD_TEST_WORKERS: 16
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  test-stable-gpu:
    strategy:
      matrix:
        python_version: ["3.10"]
        cuda_arch_version: ["12.6"]
      fail-fast: false
    runs-on: mt-l-x86aavx2-11-41-a10g
    container:
      image: "nvidia/cuda:12.6.0-devel-ubuntu22.04"
      options: --gpus all
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CUDA_ARCH_VERSION: ${{ matrix.cuda_arch_version }}
          TORCH_VERSION: stable
          # run_test.sh skips test_distributed.py: its CUDA tests need 2 GPUs,
          # and test-stable-cpu (3.10) runs the rest on the same Python and
          # torch.
          TD_SKIP_DISTRIBUTED_TESTS: "1"
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          export CU_VERSION="cu${CUDA_ARCH_VERSION:0:2}${CUDA_ARCH_VERSION:3:1}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-stable-gpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  test-stable-cpu:
    strategy:
      matrix:
        python_version: ["3.10", "3.14"]
      fail-fast: false
    runs-on: mt-l-x86iavx512-48-384
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CU_VERSION: cpu
          TORCH_VERSION: stable
          # pytest-xdist workers for run_test.sh; the runner has 48 CPUs.
          TD_TEST_WORKERS: 16
          # The known failures of TestContainersCompile in
          # test/tensordict/test_conformance.py depend on the torch version,
          # so one job runs it: the one that gets the newest stable torch
          # (torch 2.15 has no Python 3.10 wheels).
          TENSORDICT_COMPILE_CONFORMANCE: ${{ matrix.python_version == '3.14' && '1' || '' }}
          # Run the examples of the docstrings and of the docs (run_test.sh)
          # in the jobs with the newest and the oldest pinned torch.
          TD_RUN_DOCTESTS: ${{ matrix.python_version == '3.14' && '1' || '' }}
          # The ONNX export tests skip without onnx. One job installs it: a
          # released Python with stable torch, which onnxruntime supports.
          TD_INSTALL_ONNX: ${{ matrix.python_version == '3.14' && '1' || '' }}
          # The pyright typing tests skip without pyright. One job with a
          # stable torch installs a pinned pyright (install.sh); the variable
          # below stops pyright from asking PyPI for its latest version.
          TD_INSTALL_PYRIGHT: ${{ matrix.python_version == '3.10' && '1' || '' }}
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-stable-cpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  # The oldest torch that pyproject.toml accepts. Update both together.
  test-oldest-cpu:
    strategy:
      matrix:
        python_version: ["3.10"]
      fail-fast: false
    runs-on: mt-l-x86iavx512-48-384
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CU_VERSION: cpu
          TORCH_VERSION: "2.11"
          # tensordict does not require NumPy 2: this job tests NumPy 1
          NUMPY_SPEC: "<2"
          # Run the examples of the docstrings and of the docs (run_test.sh).
          TD_RUN_DOCTESTS: "1"
          # pytest-xdist workers for run_test.sh; the runner has 48 CPUs.
          TD_TEST_WORKERS: 16
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-oldest-cpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  # The oldest releases of the optional packages that pyproject.toml's extras
  # accept, which run_test_min_deps.sh pins, with the oldest torch. It runs the
  # tests of the features that need them. Update the pins and the extras together.
  test-min-deps-cpu:
    strategy:
      matrix:
        # zarr>=3 requires Python>=3.11
        python_version: ["3.11"]
      fail-fast: false
    runs-on: mt-l-x86iavx512-48-384
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 90
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CU_VERSION: cpu
          TORCH_VERSION: "2.11"
          # pytest-xdist workers for run_test_min_deps.sh; the runner has 48 CPUs.
          TD_TEST_WORKERS: 16
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test_min_deps.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-min-deps-cpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore

  # pyarrow 15, the oldest release that from_arrow and to_arrow support, which
  # run_test_pyarrow15.sh pins, with the oldest torch. It runs the tabular tests,
  # which test-min-deps-cpu runs with pyarrow 10 and without the Arrow tests.
  test-pyarrow15-cpu:
    strategy:
      matrix:
        python_version: ["3.11"]
      fail-fast: false
    # The runner and container of test-min-deps-cpu, a pairing CI already runs.
    runs-on: mt-l-x86iavx512-48-384
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 60
    permissions:
      contents: read
    # The scripts below source conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the scripts need.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CU_VERSION: cpu
          TORCH_VERSION: "2.11"
          # pytest-xdist workers for run_test_pyarrow15.sh; the runner has 8 CPUs.
          TD_TEST_WORKERS: 4
          ARCH: x86_64
          RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -eux
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/linux/scripts/setup_env.sh
          bash .github/unittest/linux/scripts/install.sh
          bash .github/unittest/linux/scripts/run_test_pyarrow15.sh

      - name: Collect junit results
        if: always()
        run: ls -la "${{ github.workspace }}/artifacts" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pyarrow15-cpu-${{ matrix.python_version }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore
