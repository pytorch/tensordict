# TensorDict Release Workflow
#
# Run it from the release/X.Y.Z branch. The full procedure, including how to
# choose the inputs, is in .github/RELEASE_AGENT_PROMPT.md.
#
# This workflow automates the release process for tensordict:
# 1. Sanity checks (version files, branch, tag, PyPI)
# 2. Builds the wheel (one py3-none-any wheel) and smoke-tests it on each platform
# 3. Collects wheels into a single artifact
# 4. Updates gh-pages docs (stable symlink)
# 5. Creates draft GitHub release with wheels attached
# 6. Publishes to PyPI using OIDC trusted publishing
#
# Triggers:
# - Manual workflow_dispatch only (no automatic triggers)
#
# NOTE: This workflow is NOT automatically triggered on tag push to avoid
# race conditions with wheel builds. Use workflow_dispatch to trigger releases.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.11.0)'
        required: true
        type: string
      python_versions:
        description: 'JSON list of the Python versions to smoke-test the wheel on, e.g. ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]. Use the set of the previous release unless it changes.'
        required: true
        type: string
      pytorch_release:
        description: 'pytorch/test-infra branch for the build, e.g. release/2.14. It sets the torch version that the build and its Linux smoke test install.'
        required: true
        type: string
      skip_sanity_checks:
        description: 'Skip sanity checks (dry runs only; real runs always run them)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (skip docs push, GitHub release, PyPI publish)'
        required: false
        type: boolean
        default: false
      wheel_variants:
        description: 'Which wheel variants to collect (cpu recommended for tensordict)'
        required: false
        type: choice
        options:
          - cpu
          - gpu
          - all
        default: 'cpu'

# One release run per branch at a time. A new run waits for the current one
# instead of cancelling it, so that a second dispatch cannot interrupt a
# publish. Use `gh run cancel` to stop a run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  # Release tag from manual input
  RELEASE_TAG: ${{ inputs.tag }}
  # The test-infra ref for the builds
  TEST_INFRA_REF: ${{ inputs.pytorch_release }}
  # Dry run mode from input
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # =============================================================================
  # SANITY CHECKS
  # =============================================================================
  sanity-checks:
    name: Sanity Checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_sanity_checks || !inputs.dry_run }}
    outputs:
      version: ${{ steps.parse-version.outputs.version }}
      version_major_minor: ${{ steps.parse-version.outputs.version_major_minor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: parse-version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          echo "Processing tag: $TAG"

          # Validate tag format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG. Expected format: v0.11.0"
            exit 1
          fi

          # Extract version without 'v' prefix
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Extract major.minor for docs folder
          VERSION_MAJOR_MINOR=$(echo "$VERSION" | sed 's/\([0-9]\+\)\.\([0-9]\+\)\.[0-9]\+/\1.\2/')
          echo "version_major_minor=$VERSION_MAJOR_MINOR" >> $GITHUB_OUTPUT

          echo "Parsed version: $VERSION"
          echo "Major.minor: $VERSION_MAJOR_MINOR"

      - name: Check the branch, the tag and PyPI
        env:
          VERSION: ${{ steps.parse-version.outputs.version }}
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          if ! python3 -c 'import json, sys; v = json.loads(sys.argv[1]); assert isinstance(v, list) and all(isinstance(x, str) for x in v)' "$PYTHON_VERSIONS"; then
            echo "::error::python_versions must be a JSON list of strings, got: $PYTHON_VERSIONS"
            exit 1
          fi

          # version_script.sh sets the release version only on release/*
          # branches. Wheels built from any other ref get a dev version.
          if [[ "$GITHUB_REF" != "refs/heads/release/$VERSION" ]]; then
            echo "::error::Run this workflow from the release/$VERSION branch, not from $GITHUB_REF."
            exit 1
          fi

          # A real run must build the tagged commit. Pushing the tag publishes
          # the docs and starts the conda-forge update, so the tag cannot move
          # afterwards to match a later commit.
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::warning::Tag $TAG points to $TAG_SHA, not to the commit being built ($GITHUB_SHA)."
            fi
          elif [[ -z "$TAG_SHA" ]]; then
            echo "::error::Tag $TAG does not exist. Push it at $GITHUB_SHA before the real run."
            exit 1
          elif [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG points to $TAG_SHA, but this run builds $GITHUB_SHA."
            exit 1
          fi

          # PyPI does not accept the same file twice.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/tensordict/$VERSION/json" || echo "000")
          if [[ "$HTTP_STATUS" == "200" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::tensordict $VERSION is already on PyPI."
            else
              echo "::error::tensordict $VERSION is already on PyPI."
              exit 1
            fi
          fi

          echo "Building $GITHUB_SHA from $GITHUB_REF for $TAG"

      - name: Check all version files match tag
        run: |
          VERSION="${{ steps.parse-version.outputs.version }}"

          echo "=============================================="
          echo "Checking all 3 version files match tag: $VERSION"
          echo "=============================================="

          # Read all 3 version files
          ROOT_VERSION=$(cat version.txt | tr -d '[:space:]')
          SCRIPTS_VERSION=$(cat .github/scripts/version.txt | tr -d '[:space:]')
          SCRIPT_SH_VERSION=$(grep "^BASE_VERSION=" .github/scripts/version_script.sh | cut -d'=' -f2)

          echo ""
          echo "Version file contents:"
          echo "  Tag version:                              $VERSION"
          echo "  version.txt:                              $ROOT_VERSION"
          echo "  .github/scripts/version.txt:              $SCRIPTS_VERSION"
          echo "  .github/scripts/version_script.sh:        $SCRIPT_SH_VERSION"
          echo ""

          # Check all files match each other first
          MISMATCH=0

          if [[ "$ROOT_VERSION" != "$SCRIPTS_VERSION" ]]; then
            echo "::error::version.txt ($ROOT_VERSION) != .github/scripts/version.txt ($SCRIPTS_VERSION)"
            MISMATCH=1
          fi

          if [[ "$ROOT_VERSION" != "$SCRIPT_SH_VERSION" ]]; then
            echo "::error::version.txt ($ROOT_VERSION) != version_script.sh ($SCRIPT_SH_VERSION)"
            MISMATCH=1
          fi

          if [[ "$MISMATCH" == "1" ]]; then
            echo ""
            echo "::error::Version files are inconsistent! All 3 files must have the same version."
            echo "::error::Please update all files listed under 'Bump the version' in RELEASE_AGENT_PROMPT.md"
            exit 1
          fi

          echo "✓ All version files are consistent with each other"

          # Now check they match the tag
          if [[ "$ROOT_VERSION" != "$VERSION" ]]; then
            echo ""
            echo "::error::Version files ($ROOT_VERSION) do not match tag version ($VERSION)"
            echo "::error::Either the tag is wrong or the version files need to be updated."
            exit 1
          fi

          echo "✓ All version files match the tag version ($VERSION)"
          echo ""
          echo "Version check passed!"

      - name: Check library version
        run: |
          VERSION="${{ steps.parse-version.outputs.version }}"

          # Install minimal dependencies
          pip install setuptools setuptools_scm

          # Set the version via setuptools_scm pretend
          export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION"

          # Try to get the version from the package
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from tensordict._version import __version__
              print(f'Library version: {__version__}')
              # Note: _version.py is auto-generated, so we just check it's readable
          except ImportError:
              # _version.py may not exist until build
              print('_version.py not found (will be generated at build time)')
          "

      - name: Check stable docs version
        run: |
          VERSION_MAJOR_MINOR="${{ steps.parse-version.outputs.version_major_minor }}"

          # Fetch the stable docs index page
          DOCS_URL="https://docs.pytorch.org/tensordict/stable/index.html"

          # Try to check if the page exists and contains version info
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOCS_URL" || echo "000")

          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "Stable docs are accessible at $DOCS_URL"
            echo "::notice::Docs will be updated to point to version $VERSION_MAJOR_MINOR"
          elif [[ "$HTTP_STATUS" == "404" ]]; then
            echo "::notice::Stable docs not found at $DOCS_URL (may be a first release)"
          else
            echo "::warning::Could not check stable docs (HTTP $HTTP_STATUS)"
          fi

  # =============================================================================
  # BUILD THE WHEEL
  # =============================================================================
  # tensordict is pure Python, so one py3-none-any wheel serves every platform
  # and Python version.

  build:
    name: Build Wheel
    needs: [sanity-checks]
    if: ${{ !cancelled() && (needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped') }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      test-infra-ref: ${{ inputs.pytorch_release }}
      # The wheel is built once; the smoke tests install it on these versions.
      python-versions: ${{ inputs.python_versions }}

  # =============================================================================
  # COLLECT WHEELS
  # =============================================================================
  collect-wheels:
    name: Collect Wheels
    needs: [sanity-checks, build]
    # Only run when the build succeeds. This ensures:
    # 1. A wheel that failed its smoke tests is never collected
    # 2. If the build fails, this job is "skipped" (not "failed")
    # 3. Re-running the failed build job will also trigger this job
    if: |
      always() && !cancelled() &&
      needs.build.result == 'success' &&
      (needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          echo "Build result: ${{ needs.build.result }}"
          echo "The build succeeded - proceeding with wheel collection"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels-raw
          # Pattern based on wheel_variants input:
          # - cpu: Only CPU builds (recommended - avoids duplicate wheel conflicts)
          # - gpu: Only CUDA builds
          # - all: All variants (requires deduplication)
          # pytorch/test-infra uploads artifacts named like: pytorch_tensordict__3.11_cpu_x86_64
          pattern: ${{ inputs.wheel_variants == 'gpu' && 'pytorch_tensordict__*_cu*' || inputs.wheel_variants == 'all' && 'pytorch_tensordict*' || 'pytorch_tensordict__*_cpu_*' }}
          merge-multiple: true

      - name: Deduplicate and verify wheels
        run: |
          # When downloading gpu/all variants, multiple artifacts may contain
          # wheels with the same filename (e.g., CUDA 12.6 and CUDA 12.8 both
          # produce tensordict-X.Y.Z-cpXX-cpXX-manylinux_x86_64.whl).
          # merge-multiple can cause corruption when this happens.
          # We deduplicate by keeping only unique wheel filenames.
          mkdir -p wheels
          echo "Processing wheels..."

          # Find all wheels and copy unique ones (first occurrence wins)
          for wheel in $(find wheels-raw -name "*.whl" -type f | sort); do
            basename=$(basename "$wheel")
            if [[ ! -f "wheels/$basename" ]]; then
              cp "$wheel" "wheels/$basename"
              echo "  Kept: $basename"
            else
              echo "  Skip duplicate: $basename"
            fi
          done

          # Verify all wheels are valid zip files
          echo ""
          echo "Verifying wheel integrity..."
          CORRUPTED=0
          for wheel in wheels/*.whl; do
            if python3 -c "import zipfile; zipfile.ZipFile('$wheel')" 2>/dev/null; then
              echo "  OK: $(basename $wheel)"
            else
              echo "  CORRUPTED: $(basename $wheel)"
              CORRUPTED=1
            fi
          done

          if [[ $CORRUPTED -eq 1 ]]; then
            echo ""
            echo "ERROR: One or more wheels are corrupted!"
            exit 1
          fi

      - name: List collected wheels
        run: |
          echo "Collected wheels:"
          ls -la wheels/*.whl | sort
          echo ""
          echo "Total wheels: $(ls wheels/*.whl 2>/dev/null | wc -l)"
          # tensordict is pure Python: expect exactly one py3-none-any wheel
          WHEEL_COUNT=$(find wheels -name "*.whl" -type f | wc -l)
          PURE_COUNT=$(find wheels -name "*-py3-none-any.whl" -type f | wc -l)
          if [[ "$WHEEL_COUNT" -ne 1 || "$PURE_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one py3-none-any wheel"
            exit 1
          fi

      - name: Upload combined wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: wheels/*.whl
          if-no-files-found: error

  # =============================================================================
  # UPDATE GH-PAGES DOCS
  # =============================================================================
  update-docs:
    name: Update Stable Docs
    needs: [sanity-checks, collect-wheels]
    if: ${{ !cancelled() && needs.collect-wheels.result == 'success' && needs.sanity-checks.result != 'failure' }}
    runs-on: ubuntu-latest
    # One stable update at a time, so that two releases from different branches
    # do not both move `stable`. With `queue: max`, later ones wait instead of
    # being cancelled. Other jobs that push to gh-pages write other folders, and
    # the push below rebases onto them.
    concurrency:
      group: gh-pages-stable
      queue: max
    steps:
      - name: Get version info
        id: version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          VERSION_MAJOR_MINOR=$(echo "$VERSION" | sed 's/\([0-9]\+\)\.\([0-9]\+\)\.[0-9]\+/\1.\2/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_major_minor=$VERSION_MAJOR_MINOR" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update stable symlink and versions.html
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          VERSION_MAJOR_MINOR="${{ steps.version.outputs.version_major_minor }}"

          echo "Updating stable docs to version $VERSION_MAJOR_MINOR"

          # Check if the version folder exists
          if [[ ! -d "$VERSION_MAJOR_MINOR" ]]; then
            echo "::error::Docs folder for $VERSION_MAJOR_MINOR does not exist. Run docs workflow first."
            exit 1
          fi

          # A release of an older line must not move stable back.
          CURRENT=$(readlink stable || true)
          if [[ -n "$CURRENT" && "$(printf '%s\n' "$CURRENT" "$VERSION_MAJOR_MINOR" | sort -V | tail -n 1)" != "$VERSION_MAJOR_MINOR" ]]; then
            echo "::notice::stable points to $CURRENT, which is newer than $VERSION_MAJOR_MINOR. Leaving it unchanged."
            exit 0
          fi

          # Update stable symlink
          rm -f stable
          ln -sf "$VERSION_MAJOR_MINOR" stable
          echo "Updated stable symlink -> $VERSION_MAJOR_MINOR"

          # Update versions.html if it exists
          if [[ -f "versions.html" ]]; then
            # Check if this version is already in versions.html
            if ! grep -q "\"$VERSION_MAJOR_MINOR\"" versions.html; then
              echo "::notice::Version $VERSION_MAJOR_MINOR not in versions.html, may need manual update"
            fi
          fi

          # Check if changes were made
          if git diff --quiet; then
            echo "::notice::Stable docs already point to $VERSION_MAJOR_MINOR. No changes needed."
            exit 0
          fi

          # Commit and push
          git config user.name 'pytorchbot'
          git config user.email 'soumith+bot@pytorch.org'
          git add stable versions.html 2>/dev/null || git add stable
          git commit -m "Update stable docs to $VERSION_MAJOR_MINOR"
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            elif [[ "${attempt}" == 5 ]]; then
              echo "::error::Could not push to gh-pages after ${attempt} attempts."
              exit 1
            fi
            sleep $((attempt * 10))
            git pull --rebase origin gh-pages
          done

          echo "Successfully updated stable docs"

      - name: Dry run - show what would be changed
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          VERSION_MAJOR_MINOR="${{ steps.version.outputs.version_major_minor }}"
          echo "DRY RUN: Would update stable symlink to point to $VERSION_MAJOR_MINOR"

          if [[ -L "stable" ]]; then
            CURRENT=$(readlink stable)
            echo "Current stable points to: $CURRENT"
          else
            echo "stable is not a symlink (or doesn't exist)"
          fi

  # =============================================================================
  # CREATE GITHUB RELEASE
  # =============================================================================
  create-release:
    name: Create GitHub Release
    needs: [sanity-checks, collect-wheels, update-docs]
    if: ${{ !cancelled() && needs.collect-wheels.result == 'success' && needs.sanity-checks.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: wheels

      - name: List wheels to attach
        run: |
          echo "Wheels to attach to release:"
          find wheels -name "*.whl" -type f | sort

      - name: Create draft release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          # Check if release already exists
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists. Updating..."
            # Upload wheels to existing release
            find wheels -name "*.whl" -type f -exec gh release upload "$TAG" {} --clobber \;
          else
            echo "Creating draft release for $TAG"
            # Create draft release without auto-generated notes
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "TensorDict $TAG" \
              --notes "Release notes for TensorDict $TAG

          ## Highlights

          <!-- Add release highlights here -->

          ## What's Changed

          <!-- Release notes will be written manually -->

          ## Installation

          \`\`\`bash
          pip install tensordict==${TAG#v}
          \`\`\`
          " \
              wheels/*.whl
          fi

          echo "Draft release created/updated: $TAG"
          echo "Please review and publish the release manually."

      - name: Dry run - show release info
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          WHEEL_COUNT=$(find wheels -name "*.whl" -type f | wc -l)
          echo "DRY RUN: Would create draft release for $TAG"
          echo "Would attach $WHEEL_COUNT wheel files"

  # =============================================================================
  # PUBLISH TO PYPI
  # =============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: [sanity-checks, collect-wheels, create-release]
    if: ${{ !cancelled() && needs.collect-wheels.result == 'success' && needs.sanity-checks.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tensordict/
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Flatten wheel directory
        run: |
          # Move all wheels to dist/ root for PyPI upload
          find dist -name "*.whl" -exec mv {} dist/ \;
          find dist -type d -empty -delete
          echo "Wheels prepared for upload:"
          ls -la dist/

      - name: Publish to PyPI (OIDC)
        if: ${{ env.DRY_RUN != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Using OIDC trusted publishing - no token needed
          # Repository must be configured in PyPI to trust this workflow
          verbose: true
          print-hash: true
          # Lets a re-run of this job finish a partial upload. The sanity
          # checks stop a new run for a version that is already on PyPI.
          skip-existing: true

      - name: Dry run - show what would be published
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          echo "DRY RUN: Would publish the following wheels to PyPI:"
          ls -la dist/
          echo ""
          echo "Total: $(ls dist/*.whl | wc -l) wheels"

  # =============================================================================
  # SUMMARY
  # =============================================================================
  release-summary:
    name: Release Summary
    needs: [sanity-checks, build, collect-wheels, update-docs, create-release, publish-pypi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          echo "## Release Summary for ${{ env.RELEASE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Sanity Checks | ${{ needs.sanity-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Wheel | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Collect Wheels | ${{ needs.collect-wheels.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update Docs | ${{ needs.update-docs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Create Release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish PyPI | ${{ needs.publish-pypi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ env.DRY_RUN }}" == "true" ]]; then
            echo "**Note: This was a dry run. No changes were pushed.**" >> $GITHUB_STEP_SUMMARY
          fi

          # Determine overall status
          if [[ "${{ needs.publish-pypi.result }}" == "success" ]]; then
            echo "### Release completed successfully!" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.collect-wheels.result }}" == "success" ]]; then
            echo "### Wheels built successfully. Check individual steps for issues." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Release encountered issues. Please review the logs." >> $GITHUB_STEP_SUMMARY
          fi
