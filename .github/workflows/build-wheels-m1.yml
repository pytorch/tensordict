name: Build M1 Wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      # NOTE: release/* branches are NOT listed here to avoid race conditions
      # with the Release workflow which calls this workflow via workflow_call
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_call:
    inputs:
      test-infra-ref:
        description: 'Branch of pytorch/test-infra to use (e.g., release/2.8 for stable PyTorch)'
        required: false
        type: string
        default: 'main'
      python-versions:
        description: 'JSON-encoded list of Python versions to build; empty builds all supported versions'
        required: false
        type: string
        default: '[]'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: macos-arm64
      test-infra-repository: pytorch/test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      python-versions: ${{ inputs.python-versions || '[]' }}
  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: pytorch/tensordict
            smoke-test-script: test/smoke_test.py
            pre-script: .github/scripts/linux-pre-script.sh
            post-script: .github/scripts/linux-post-script.sh
            package-name: tensordict
    name: ${{ matrix.repository }}
    uses: pytorch/test-infra/.github/workflows/build_wheels_macos.yml@main
    with:
      repository: ${{ matrix.repository }}
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      package-name: ${{ matrix.package-name }}
      runner-type: macos-m2-15
      smoke-test-script: ${{ matrix.smoke-test-script }}
      trigger-event: ${{ github.event_name }}
      env-var-script: .github/scripts/version_script.sh
      build-command: pip wheel --no-deps . && mkdir -p dist && mv tensordict*.whl ./dist
      build-platform: python-build-package
      # Workaround for the M1 runners' Homebrew miniconda base env moving to
      # py3.14, where test-infra's `conda install -y conda=25.3.0` no longer
      # solves. Provisioning a fresh miniconda gives an active py3.10 env where
      # the pin still solves. Drop once pytorch/test-infra bumps its conda pin
      # (https://github.com/pytorch/test-infra/pull/7951).
      setup-miniconda: true
