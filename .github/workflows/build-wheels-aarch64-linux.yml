name: Build Aarch64 Linux Wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      # NOTE: release/* branches are NOT listed here to avoid race conditions
      # with the Release workflow which calls this workflow via workflow_call
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  schedule:
    - cron: '45 13 * * *'
  workflow_call:
    inputs:
      test-infra-ref:
        description: 'Branch of pytorch/test-infra to use (e.g., release/2.8 for stable PyTorch)'
        required: false
        type: string
        default: 'main'
      nightly:
        description: 'Build and publish tensordict-nightly wheels'
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Build and publish tensordict-nightly wheels'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux-aarch64
      channel: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || '' }}
      test-infra-repository: pytorch/test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      with-cuda: disable
  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: pytorch/tensordict
            package-name: tensordict
            smoke-test-script: test/smoke_test.py
    name: pytorch/tensordict
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: ${{ matrix.repository }}
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      package-name: ${{ matrix.package-name }}
      smoke-test-script: ${{ matrix.smoke-test-script }}
      trigger-event: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'schedule' || github.event_name }}
      env-var-script: .github/scripts/version_script.sh
      architecture: aarch64
      setup-miniconda: false
      build-command: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'bash .github/scripts/build_nightly_wheel.sh' || 'pip wheel . && mkdir -p dist && mv tensordict*.whl ./dist' }}
      build-platform: python-build-package
      upload-to-pypi: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'cpu' || '' }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_TOKEN }}
