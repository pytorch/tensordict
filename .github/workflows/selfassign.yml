# Allow users to automatically tag themselves to issues
#
# Usage:
#  - a github user (a member of the repo) needs to comment
#    with "#self-assign" on an issue to be assigned to them.
#------------------------------------------------------------

name: Self-assign
on:
  issue_comment:
    types: created

concurrency:
  # One group per issue, so that a comment on one issue cannot cancel the run for another. Runs queue rather
  # than cancel, so that a later comment on the same issue does not drop an earlier "#take".
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  one:
    runs-on: ubuntu-latest
    permissions:
      issues: write # assign user to the commented issue
    if: >-
      (github.event.comment.body == '#take' ||
       github.event.comment.body == '#self-assign')
    steps:
      - run: |
          echo "Assigning issue ${{ github.event.issue.number }} to ${{ github.event.comment.user.login }}"
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -d '{"assignees": ["${{ github.event.comment.user.login }}"]}' \
                  https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/assignees
          echo "Done 🔥 "
