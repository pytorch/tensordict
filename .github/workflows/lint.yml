name: Lint

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - nightly
      - main
      - release/*
  workflow_dispatch:
  workflow_call:

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On master, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: lint-${{ github.ref == 'refs/heads/main' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  python-source-and-configs:
    # A GitHub-hosted runner: the hooks need no GPU or test-infra image, and the
    # pod setup of test-infra's linux_job took ~3 of the job's 4 minutes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # torchfix segfaults or hangs under CPython 3.14, so pin the interpreter
      # that pre-commit and its hook environments use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install lint tools
        run: |
          python -m pip install --upgrade -c .github/ci-constraints.txt pip certifi
          pip install --progress-bar=off pre-commit
      - name: Lint Python source and configs
        run: |
          if ! pre-commit run --all-files; then
            git --no-pager diff
            exit 1
          fi
