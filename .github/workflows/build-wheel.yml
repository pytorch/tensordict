name: Build Wheel

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      # NOTE: release/* branches are NOT listed here to avoid race conditions
      # with the Release workflow which calls this workflow via workflow_call
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_call:
    inputs:
      test-infra-ref:
        description: 'Branch of pytorch/test-infra to use (e.g., release/2.8 for stable PyTorch)'
        required: false
        type: string
        default: 'main'
      python-versions:
        description: 'JSON list of the Python versions to smoke-test the wheel on'
        required: false
        type: string
        default: '["3.10", "3.14"]'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      runner-fleet: osdc
      with-cuda: disable
      with-rocm: disable
      # tensordict is pure Python: one py3-none-any wheel serves every platform
      # and Python version, so it is built once, with the oldest supported Python.
      build-python-only: enable
      test-infra-repository: pytorch/test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: pytorch/tensordict
            smoke-test-script: test/smoke_test.py
            package-name: tensordict
    name: pytorch/tensordict
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: ${{ matrix.repository }}
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: ${{ inputs.test-infra-ref || 'main' }}
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      package-name: ${{ matrix.package-name }}
      smoke-test-script: ${{ matrix.smoke-test-script }}
      trigger-event: ${{ github.event_name }}
      env-var-script: .github/scripts/version_script.sh
      build-command: pip wheel --no-deps . && mkdir -p dist && mv tensordict*.whl ./dist
      build-platform: python-build-package
  smoke-test:
    # The build job smoke-tests the wheel on Linux x86_64 with one Python.
    # This job installs the same wheel on the other platforms.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04-arm]
        python-version: ${{ fromJSON(inputs.python-versions || '["3.10", "3.14"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the wheel
        uses: actions/download-artifact@v4
        with:
          # test-infra names the artifact like pytorch_tensordict__3.10_cpu_x86_64
          pattern: pytorch_tensordict__*
          path: wheels
          merge-multiple: true
      - name: Install PyTorch and the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install wheels/tensordict-*-py3-none-any.whl pytest
      - name: Run the smoke test
        shell: bash
        run: |
          # Import the installed wheel, not the checked-out sources.
          rm -rf tensordict
          python -m pytest test/smoke_test.py -v
