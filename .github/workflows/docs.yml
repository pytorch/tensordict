# This workflow builds the tensordict docs and deploys them to gh-pages.
name: Generate documentation
on:
  push:
    branches:
      - nightly
      - main
      - release/*
    tags:
      - v[0-9]+.[0-9]+.[0-9]
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On master, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: docs-${{ github.ref == 'refs/heads/main' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build-docs:
    strategy:
      matrix:
        # The zarr tutorial needs zarr>=3, which requires Python>=3.11.
        python_version: ["3.12"]
        cuda_arch_version: ["12.8"]
    runs-on: "mt-l-x86aavx2-11-41-a10g"
    container:
      image: "nvidia/cuda:12.8.0-devel-ubuntu22.04"
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    # setup_env.sh bootstraps and sources conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    env:
      RUNNER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      RUNNER_DOCS_DIR: ${{ github.workspace }}/docs-preview
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which setup_env.sh needs.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      - name: Build docs
        run: |
          mkdir -p "${RUNNER_ARTIFACT_DIR}" "${RUNNER_DOCS_DIR}"
          set -e
          set -v

          # Set up environment variables
          export PYTHON_VERSION=${{ matrix.python_version }}
          export CU_VERSION="cpu"
          export TORCH_VERSION=nightly
          export ARCH=x86_64

          # Use existing setup script
          bash .github/unittest/linux/scripts/setup_env.sh

          # Install additional tools needed for docs build
          apt update && apt install -y unzip

          # Activate the conda environment
          eval "$(./conda/bin/conda shell.bash hook)"
          conda activate "./env"

          # Install PyTorch and torchvision (CPU version for docs)
          python -m pip install --pre torch torchvision --index-url https://download.pytorch.org/whl/nightly/cpu -U --quiet --root-user-action=ignore

          # Install tensordict runtime deps explicitly (except torch which is handled above),
          # then install tensordict without resolving dependencies to avoid any solver changing the
          # PyTorch build (stable vs nightly).
          python -m pip install -U packaging pyvers importlib_metadata --quiet --root-user-action=ignore

          # Set up versioning environment (conditional on release branch/tag)
          export GITHUB_REF_TYPE=${{ github.ref_type }}
          export GITHUB_REF_NAME=${{ github.ref_name }}
          source .github/scripts/version_script.sh

          # Install tensordict -- install as develop if not on a release branch
          if [[ ${{ github.ref_type }} == branch && ${{ github.ref_name }} == release/* ]] || [[ ${{ github.ref_type }} == tag ]]; then
            python -m pip install . --no-deps
          else
            python -m pip install -e . --no-deps
          fi

          # Install docs requirements
          export TD_GET_DEFAULTS_TO_NONE='1'
          python -m pip install -r docs/requirements.txt --quiet --root-user-action=ignore

          # Test tensordict installation
          mkdir _tmp
          cd _tmp
          PYOPENGL_PLATFORM=egl MUJOCO_GL=egl python -c "from tensordict import *"
          cd ..

          # Set sanitize version for releases
          if [[ ${{ github.event_name }} == push && (${{ github.ref_type }} == tag || (${{ github.ref_type }} == branch && ${{ github.ref_name }} == release/*)) ]]; then
            echo '::group::Enable version string sanitization'
            # This environment variable just has to exist and must not be empty. The actual value is arbitrary.
            # See docs/source/conf.py for details
            export TENSORDICT_SANITIZE_VERSION_STR_IN_DOCS=1
            echo '::endgroup::'
          fi

          # Build documentation
          cd ./docs
          make docs
          cd ..

          # Copy artifacts
          cp -r docs/build/html/* "${RUNNER_ARTIFACT_DIR}"
          echo $(ls "${RUNNER_ARTIFACT_DIR}")
          if [[ ${{ github.event_name == 'pull_request' }} ]]; then
            cp -r docs/build/html/* "${RUNNER_DOCS_DIR}"
          fi

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ${{ github.workspace }}/artifacts

      # Was linux_job_v3's "Upload documentation to S3" step, which is what
      # puts a rendered preview on the pull request.
      - name: Configure AWS credentials
        if: ${{ github.event.pull_request.number != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1

      - name: Upload docs preview to S3
        if: ${{ github.event.pull_request.number != '' }}
        uses: pytorch/test-infra/.github/actions/upload-artifact-s3@main
        with:
          retention-days: 14
          s3-bucket: doc-previews
          if-no-files-found: error
          path: ${{ env.RUNNER_DOCS_DIR }}
          s3-prefix: ${{ github.repository }}/${{ github.event.pull_request.number }}
          overwrite: true

  upload:
    needs: build-docs
    if: github.repository == 'pytorch/tensordict' && github.event_name == 'push' &&
        ((github.ref_type == 'branch' && github.ref_name == 'main') || github.ref_type == 'tag')
    permissions:
      contents: write
    # Every job that pushes to gh-pages joins this group, so they push one at a
    # time. With `queue: max`, later jobs wait instead of being cancelled.
    concurrency:
      group: gh-pages
      queue: max
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      repository: pytorch/tensordict
      download-artifact: docs
      ref: gh-pages
      test-infra-ref: main
      script: |
        set -euo pipefail

        REF_TYPE=${{ github.ref_type }}
        REF_NAME=${{ github.ref_name }}

        if [[ "${REF_TYPE}" == branch ]]; then
          if [[ "${REF_NAME}" == main ]]; then
            TARGET_FOLDER="${REF_NAME}"
          # Bebug:
          # else
          #   TARGET_FOLDER="release-doc"
          fi
        elif [[ "${REF_TYPE}" == tag ]]; then
          case "${REF_NAME}" in
            *-rc*)
              echo "Aborting upload since this is an RC tag: ${REF_NAME}"
              exit 0
              ;;
            *)
              # Strip the leading "v" as well as the trailing patch version. For example:
              # 'v0.15.2' -> '0.15'
              TARGET_FOLDER=$(echo "${REF_NAME}" | sed 's/v\([0-9]\+\)\.\([0-9]\+\)\.[0-9]\+/\1.\2/')
              ;;
          esac
        fi

        echo "Target Folder: ${TARGET_FOLDER}"

        mkdir -p "${TARGET_FOLDER}"
        rm -rf "${TARGET_FOLDER}"/*

        echo $(ls "${RUNNER_ARTIFACT_DIR}")
        # Was rsync, which linux_job.yml's conda-builder image had.
        # almalinux-builder, the v3 default, does not; a plain recursive
        # copy is all this needed.
        cp -a "${RUNNER_ARTIFACT_DIR}"/. "${TARGET_FOLDER}"/
        git add "${TARGET_FOLDER}" || true

        if [[ "${TARGET_FOLDER}" == "main" ]] ; then
          mkdir -p _static
          rm -rf _static/*
          cp -r "${TARGET_FOLDER}"/_static/* _static
          git add _static || true
        fi

        git config user.name 'pytorchbot'
        git config user.email 'soumith+bot@pytorch.org'
        git config http.postBuffer 524288000
        git commit -m "auto-generating sphinx docs" || true
        git push
