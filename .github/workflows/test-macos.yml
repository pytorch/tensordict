name: Unit-tests on MacOS

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - nightly
      - main
      - release/*
  workflow_dispatch:
  workflow_call:

env:
  CHANNEL: "nightly"

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On master, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  # The Nightly Orchestrator calls this workflow, and a called workflow evaluates the group with the caller's
  # context: without the event name, the nightly run for main's head joined the group of its push run and
  # cancelled it.
  group: test-macos-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  tests-silicon:
    strategy:
      matrix:
        # The oldest and the newest Python with torch nightly wheels: torch
        # nightlies have no Python 3.10 wheels since 2.15, and the index still
        # serves the last one, from 2026-09-23, to 3.10.
        python_version: ["3.11", "3.15"]
      fail-fast: false
    uses: pytorch/test-infra/.github/workflows/macos_job.yml@main
    with:
      runner: macos-m1-stable
      # setup_env.sh creates its own env with the Miniconda that macos_job.yml
      # installs, and needs none of the packages it pre-installs by default.
      default-packages: ""
      repository: pytorch/tensordict
      timeout: 120
      script: |
        # Set env vars from matrix
        set -e
        set -v
        export PYTHON_VERSION=${{ matrix.python_version }}
        export CU_VERSION="cpu"
        export SYSTEM_VERSION_COMPAT=0
        export TORCH_VERSION=nightly
        export ARCH=arm64
        # The macOS runners are reused between jobs, and inductor caches its
        # precompiled headers under $TMPDIR. Once a later job reinstalls torch,
        # clang rejects those headers because cpp_prefix.h has a new mtime.
        # GitHub empties $RUNNER_TEMP at the start of every job.
        export TMPDIR="$RUNNER_TEMP"
        # A process that dies on a signal prints its Python stack, also when
        # it dies while it imports torch, before a test can enable faulthandler.
        export PYTHONFAULTHANDLER=1

        # On macOS, libomp registers each process in
        # /tmp/__KMP_REGISTERED_LIB_<pid>, a file it maps and reads; it
        # ignores TMPDIR. A file left by an earlier process with the same PID
        # that died while registering crashes the next process that gets the
        # PID: an empty file with SIGBUS (#2669), a zero-filled one with
        # "OMP: Error #15 ... found unknown library" (#2482). The crashing
        # process leaves the file behind, so on these reused runners it stays
        # a trap. Remove the files of the processes that no longer run.
        for f in /tmp/__KMP_REGISTERED_LIB_*; do
          [ -e "$f" ] || continue
          pid="${f##*_}"
          if ! ps -p "$pid" > /dev/null 2>&1; then
            echo "Removing the stale libomp registration $f ($(wc -c < "$f" | tr -d ' ') bytes)"
            rm -f "$f" || true
          fi
        done

        echo "PYTHON_VERSION: $PYTHON_VERSION"
        echo "CU_VERSION: $CU_VERSION"

        ## setup_env.sh
        bash .github/unittest/linux/scripts/setup_env.sh
        bash .github/unittest/linux/scripts/install.sh
        bash .github/unittest/linux/scripts/run_test.sh
