name: Unit-tests (RL) on Linux

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
  workflow_dispatch:
  workflow_call:

env:
  CHANNEL: "nightly"
  # Keep reverse-dependency results reproducible. Bump this only after the
  # corresponding TorchRL revision has passed this integration suite.
  TORCHRL_REF: 565e826ef7589006fbde5c4c45c0ec5e2329538b

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On master, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: test-rl-gpu-${{ github.ref == 'refs/heads/main' && format('ci-master-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test-gpu:
    strategy:
      matrix:
        # torch nightlies have no Python 3.10 wheels since 2.15
        python_version: ["3.12"]
        cuda_arch_version: ["13.0"]
      fail-fast: false
    runs-on: mt-l-x86aavx2-11-41-a10g
    container:
      image: "nvidia/cuda:13.0.0-devel-ubuntu22.04"
      options: --gpus all
    timeout-minutes: 120
    permissions:
      contents: read
    # run_all.sh sources conda, so a login shell.
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Before checkout on purpose: actions/checkout needs git in the
      # container, and this image has none -- without it the checkout
      # degrades to a REST API tarball with no .git, which the script needs.
      - name: Install git
        run: |
          set -eux
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v4

      # torchrl's distributed transport does
      # socket.gethostbyname(socket.gethostname()) to pick the TCPStore
      # address. Under linux_job_v2 the script ran in a plain `docker run`,
      # which writes the container hostname into /etc/hosts; an OSDC job
      # container gets no such entry and the lookup raises
      # "gaierror: [Errno -2] Name or service not known". Everything that
      # talks to that store lives in this container, so loopback is the
      # right answer.
      - name: Make the container hostname resolvable
        run: |
          set -eux
          echo "127.0.0.1 $(hostname)" >> /etc/hosts
          getent hosts "$(hostname)"

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          CUDA_ARCH_VERSION: ${{ matrix.cuda_arch_version }}
          TORCH_VERSION: nightly
        run: |
          set -eux
          export CU_VERSION="cu${CUDA_ARCH_VERSION:0:2}${CUDA_ARCH_VERSION:3:1}"
          echo "PYTHON_VERSION: $PYTHON_VERSION"
          echo "CU_VERSION: $CU_VERSION"

          bash .github/unittest/rl_linux_optdeps/scripts/run_all.sh
